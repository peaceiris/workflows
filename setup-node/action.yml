name: 'Setup Node.js'
description: 'A composite action to setup Node.js project.'
inputs:
  node-version:
    description: 'Set a Node.js version, e.g. 18.16.0'
    required: false
  node-version-file:
    description: 'File containing the version Spec of the version to use.  Examples: .nvmrc, .node-version, .tool-versions'
    required: false
  npm-version:
    description: 'Optional npm version, range, or dist-tag to install after Node.js setup. Omit to keep the existing npm setup.'
    required: false
  cache:
    description: 'Used to specify a package manager for caching in the default directory. Supported values: npm, yarn, pnpm.'
    required: false
    default: 'npm'
runs:
  using: "composite"
  steps:
    - run: |
        npm install -g corepack
        corepack enable pnpm yarn
        if [ -z "$NPM_VERSION" ]; then
          corepack enable npm
        fi
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm-version }}

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '${{ inputs.node-version }}'
        node-version-file: '${{ inputs.node-version-file }}'
        cache: '${{ inputs.cache }}'

    - name: Setup npm
      if: ${{ inputs.npm-version != '' }}
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm-version }}
      run: npm install --global "npm@${NPM_VERSION}"
