name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  setup-node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        npm-version: ['', '12', '12.2.2']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Remove package managers that conflict with Corepack
        if: runner.os == 'Windows'
        shell: bash
        run: npm uninstall --global yarn pnpm
      - name: Setup Node.js with default npm
        if: ${{ matrix.npm-version == '' }}
        uses: ./setup-node
        with:
          node-version: '24'
      - name: Setup Node.js with requested npm
        if: ${{ matrix.npm-version != '' }}
        uses: ./setup-node
        with:
          node-version: '24'
          npm-version: ${{ matrix.npm-version }}
      - name: Verify npm and install dependencies
        shell: bash
        env:
          NPM_VERSION: ${{ matrix.npm-version }}
        run: |
          actual=$(npm --version)
          case "$NPM_VERSION" in
            '') test -n "$actual" ;;
            12) [[ "$actual" == 12.* ]] ;;
            *) test "$actual" = "$NPM_VERSION" ;;
          esac
          mkdir -p "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init --yes
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts

  setup-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./setup-docker
      - run: docker version
      - run: docker compose version
      - run: docker buildx version
